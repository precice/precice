name: Publish nightly docker release
# Builds the precice/precice:nightly image
on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        default: develop
  workflow_call:
    inputs:
      branch:
        type: string
        default: develop
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      MATRIX_BOT_HOMESERVER:
        required: true
      MATRIX_BOT_TOKEN:
        required: true
      MATRIX_BOT_ROOMID:
        required: true
  schedule:
    - cron: '0 3 * * *'

jobs:
  dockerfile:
    name: "Build precice:nightly"
    runs-on: ubuntu-latest
    if: github.repository == 'precice/precice'
    env:
        docker_username: precice
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.docker_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Dockerfile
        uses: docker/build-push-action@v7
        with:
          push: true
          file: "./tools/releasing/packaging/docker/nightly.dockerfile"
          tags: ${{ env.docker_username }}/precice:nightly
          build-args: |
            BRANCH=${{ inputs.branch || 'develop' }}
      - name: Failure Notification
        if: failure()
        uses: precice/notify-action@v0
        with:
          homeserver: ${{ secrets.MATRIX_BOT_HOMESERVER }}
          access_token: ${{ secrets.MATRIX_BOT_TOKEN }}
          room_id: ${{ secrets.MATRIX_BOT_ROOMID }}
